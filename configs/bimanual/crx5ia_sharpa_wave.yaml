  robot: configs/robots/crx5ia_sharpa_wave_left.yaml
  profile: configs/retargeting_profiles/vector_wrist_joint_crx5ia_sharpa_wave_left.yaml
  placement:
    position:
    - 0.0
    - 0.3
    - 0.0
    rpy:
    - 0.0
    - 0.0
    - 0.0
